name: Update Contributor Credits

on:
  schedule:
    # Run daily at 03:00 UTC (after upstream's scheduled release runs finish)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-contributors
  cancel-in-progress: true

jobs:
  update-credits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch contributor snapshots from upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch-contributors.py

      - name: Commit and push updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributors/
          if git diff --staged --quiet; then
            echo "No changes in contributor snapshots."
          else
            git commit -m "chore(credits): update contributor snapshots [skip ci]"
            git push
          fi
