type = "model/obj" }] }, { actions = ["android.intent.action.VIEW"], categories = ["android.intent.category.DEFAULT"], data = [{ scheme = "content", host = "*", path_pattern = ".*\\\\.sc" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.sc" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.solidcraft" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.solidcraft" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.step" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.step" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.stp" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.stp" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.stl" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.stl" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.3mf" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.3mf" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.dxf" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.dxf" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.obj" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.obj" }] }, { actions = ["android.intent.action.VIEW"], categories = ["android.intent.category.DEFAULT"], data = [{ scheme = "content", host = "*", path_pattern = ".*\\\\.sc", mime_type = "*/*" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.sc", mime_type = "*/*" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.solidcraft", mime_type = "*/*" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.solidcraft", mime_type = "*/*" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.step", mime_type = "*/*" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.step", mime_type = "*/*" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.stp", mime_type = "*/*" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.stp", mime_type = "*/*" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.stl", mime_type = "*/*" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.stl", mime_type = "*/*" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.3mf", mime_type = "*/*" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.3mf", mime_type = "*/*" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.dxf", mime_type = "*/*" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.dxf", mime_type = "*/*" }, { scheme = "content", host = "*", path_pattern = ".*\\\\.obj", mime_type = "*/*" }, { scheme = "file", host = "*", path_pattern = ".*\\\\.obj", mime_type = "*/*" }] }]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "solidcraft_android"
