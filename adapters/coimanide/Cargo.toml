[package]
name = "coimanide-android"
version = "0.3.0"
edition = "2021"
license = "MIT"

[lib]
name = "coimanide_android"
crate-type = ["cdylib"]

[dependencies]
coiman-ide = { path = "../../crates/coiman-ide" }
coiman-core = { path = "../../crates/coiman-core" }
eframe = { version = "0.37.0", default-features = false, features = [
    "wgpu",
    "clipboard",
    "default_fonts",
    "links",
    "android-native-activity",
] }
egui = "0.37.0"
egui-winit = "0.37.0"
log = "0.4"
jni = "0.22"
serde_json = "1"
# Coiman's file dialogs are the blocking `rfd::FileDialog`, which the builder vendors with an
# Android backend that routes them through `rfd::artcraft_saf` (see vendor/rfd and src/saf.rs).
rfd = { version = "0.17", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
android_logger = "0.15"

[package.metadata.android]
package = "com.artcraft.coimanide"
apk_name = "coimanide"
build_targets = ["aarch64-linux-android"]
resources = "res"
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

# Coiman edits folders the user picks through the Storage Access Framework, and its Termux
# bridge needs a shared folder both apps can see (Termux cannot write an app's own external
# files folder). Legacy permissions cover Android 12 and older; all-files access covers
# Android 11+ so the app can keep its Termux request/result files in /sdcard/Documents.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# Termux gates RUN_COMMAND on this signature permission; the service refuses commands from an
# app that does not hold it.
[[package.metadata.android.uses_permission]]
name = "com.termux.permission.RUN_COMMAND"

# Android 11+ package visibility: without this the RUN_COMMAND service cannot be resolved.
[[package.metadata.android.queries]]
package = "com.termux"

[package.metadata.android.application]
label = "Coiman IDE"
theme = "@style/Theme.Artcraft"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = ".CoimanIdActivity"
config_changes = "orientation|keyboard|keyboardHidden|navigation|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode|fontScale|locale"
label = "Coiman IDE"
launch_mode = "singleTask"
orientation = "sensor"
exported = true
# The soft keyboard must push the window up instead of covering it: Coiman keeps its terminal
# (and its panels) at the bottom, and a keyboard on top of them makes the terminal unusable.
window_soft_input_mode = "adjustResize"
# The MAIN/LAUNCHER filter that gives the APK a launcher icon; lib/file_associations.py may
# append VIEW/SEND filters for source and text documents by rewriting this single line.
intent_filter = [{ actions = ["android.intent.action.MAIN"], categories = ["android.intent.category.LAUNCHER"] }]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "coimanide_android"
