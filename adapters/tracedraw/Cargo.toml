[package]
name = "tracedraw-android"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "TraceDraw Android adapter"

[lib]
name = "tracedraw"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
tracedraw = { path = "../../apps/tracedraw" }
egui = { workspace = true }
android-activity = { version = "=0.6.1", features = ["native-activity"] }
android_logger = "=0.15.1"
jni = "=0.22.4"
log = { workspace = true }
serde_json = { workspace = true }

[package.metadata.android]
package = "dev.tracedraw.app"
apk_name = "tracedraw"
build_targets = ["aarch64-linux-android"]
resources = "res"
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[package.metadata.android.application]
label = "TraceDraw"
theme = "@style/Theme.Artcraft"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = ".TraceDrawActivity"
config_changes = "orientation|keyboard|keyboardHidden|navigation|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode|fontScale|locale"
label = "TraceDraw"
launch_mode = "singleTask"
orientation = "sensor"
exported = true
intent_filter = [{ actions = ["android.intent.action.MAIN"], categories = ["android.intent.category.LAUNCHER"] }]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "tracedraw"
