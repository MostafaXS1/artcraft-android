[package]
name = "diagramcraft-android"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
vsdx = { path = "../../crates/vsdx" }
dc-core = { path = "../../crates/dc-core" }
dc-ui = { path = "../../crates/dc-ui" }
eframe = { version = "0.37", features = ["wgpu", "persistence"] }
egui = "0.37"
egui-winit = { version = "0.37", features = ["android-native-activity", "clipboard", "links"] }
image = "0.25"
log = "0.4"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
android_logger = "0.15"

# The workspace root patches rfd, arboard, android-activity, winit, egui-winit and the egui
# crates; a member manifest must not repeat them.

[package.metadata.android]
package = "com.artcraft.diagramcraft"
apk_name = "diagramcraft"
build_targets = ["aarch64-linux-android"]
resources = "res"
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "DiagramCraft"
theme = "@style/Theme.Artcraft"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = ".DiagramCraftActivity"
config_changes = "orientation|keyboard|keyboardHidden|navigation|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode|fontScale|locale"
label = "DiagramCraft"
launch_mode = "singleTask"
orientation = "sensor"
exported = true
intent_filter = [{ actions = ["android.intent.action.MAIN"], categories = ["android.intent.category.LAUNCHER"] }, { actions = ["android.intent.action.VIEW"], categories = ["android.intent.category.DEFAULT"], data = [{ mime_type = "application/vnd.ms-visio.drawing.main+xml" }, { mime_type = "application/vnd.visio" }, { mime_type = "application/vnd.ms-visio.stencil.main+xml" }, { mime_type = "application/vnd.ms-visio.template.main+xml" }, { mime_type = "application/vnd.ms-visio.drawing.macroenabled.main+xml" }, { mime_type = "application/vnd.ms-visio.stencil.macroenabled.main+xml" }, { mime_type = "application/vnd.ms-visio.template.macroenabled.main+xml" }] }, { actions = ["android.intent.action.VIEW"], categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"], data = [{ scheme = "http", mime_type = "application/vnd.ms-visio.drawing.main+xml" }, { scheme = "https", mime_type = "application/vnd.ms-visio.drawing.main+xml" }, { scheme = "http", mime_type = "application/vnd.visio" }, { scheme = "https", mime_type = "application/vnd.visio" }, { scheme = "http", mime_type = "application/vnd.ms-visio.stencil.main+xml" }, { scheme = "https", mime_type = "application/vnd.ms-visio.stencil.main+xml" }, { scheme = "http", mime_type = "application/vnd.ms-visio.template.main+xml" }, { scheme = "https", mime_type = "application/vnd.ms-visio.template.main+xml" }, { scheme = "http", mime_type = "application/vnd.ms-visio.drawing.macroenabled.main+xml" }, { scheme = "https", mime_type = "application/vnd.ms-visio.drawing.macroenabled.main+xml" }, { scheme = "http", mime_type = "application/vnd.ms-visio.stencil.macroenabled.main+xml" }, { scheme = "https", mime_type = "application/vnd.ms-visio.stencil.macroenabled.main+xml" }, { scheme = "http", mime_type = "application/vnd.ms-visio.template.macroenabled.main+xml" }, { scheme = "https", mime_type = "application/vnd.ms-visio.template.macroenabled.main+xml" }] }, { actions = ["android.intent.action.SEND", "android.intent.action.SEND_MULTIPLE"], categories = ["android.intent.category.DEFAULT"], data = [{ mime_type = "application/vnd.ms-visio.drawing.main+xml" }, { mime_type = "application/vnd.visio" }, { mime_type = "application/vnd.ms-visio.stencil.main+xml" }, { mime_type = "application/vnd.ms-visio.template.main+xml" }, { mime_type = "application/vnd.ms-visio.drawing.macroenabled.main+xml" }, { mime_type = "application/vnd.ms-visio.stencil.macroenabled.main+xml" }, { mime_type = "application/vnd.ms-visio.template.macroenabled.main+xml" }] }]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "diagramcraft_android"