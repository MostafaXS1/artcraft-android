[package]
name = "paintcraft-android"
version.workspace = true
edition.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
paintcraft = { path = "../../apps/paintcraft" }
paintcraft-formats = { path = "../../crates/services/paintcraft-formats" }
paintcraft-platform = { path = "../../crates/services/paintcraft-platform" }
paintcraft-ui = { path = "../../crates/presentation/paintcraft-ui" }
eframe = { workspace = true, features = ["wgpu", "persistence"] }
egui = { workspace = true }
egui-winit = { workspace = true }
rfd = { workspace = true }
log = "0.4"
serde_json = "1.0"
jni = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
android_logger = "0.15"

[package.metadata.android]
package = "com.artcraft.paintcraft"
apk_name = "paintcraft"
build_targets = ["aarch64-linux-android"]
resources = "res"
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "PaintCraft"
theme = "@style/Theme.Artcraft"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = ".PaintCraftActivity"
config_changes = "orientation|keyboard|keyboardHidden|navigation|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode|fontScale|locale"
label = "PaintCraft"
launch_mode = "singleTask"
orientation = "sensor"
exported = true
intent_filter = [{ actions = ["android.intent.action.MAIN"], categories = ["android.intent.category.LAUNCHER"] }]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "paintcraft_android"
