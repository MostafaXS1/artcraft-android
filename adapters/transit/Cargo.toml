[package]
name = "transit-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
transit-ui-studio = { workspace = true }
transit-engine = { workspace = true }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "persistence", "android-native-activity"] }
egui = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["android-native-activity", "clipboard", "links"] }
rfd = "0.17"
log = "0.4"
serde_json = "1.0"
jni = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
android_logger = "0.15"

[package.metadata.android]
package = "com.artcraft.transit"
apk_name = "transit"
build_targets = ["aarch64-linux-android"]
resources = "res"
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Transit"
theme = "@style/Theme.Artcraft"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = ".TransitActivity"
config_changes = "orientation|keyboard|keyboardHidden|navigation|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode|fontScale|locale"
label = "Transit"
launch_mode = "singleTask"
orientation = "sensor"
exported = true
intent_filter = [{ actions = ["android.intent.action.MAIN"], categories = ["android.intent.category.LAUNCHER"] }]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "transit_android"
