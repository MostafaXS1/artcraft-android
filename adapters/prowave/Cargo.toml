[package]
name = "prowave-android"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The desktop app's default features (`x11`, `accessibility`) are desktop-only: the
# `accessibility` one pulls `eframe/accesskit`, which eframe refuses with the
# `android-native-activity` backend the Android build uses ("`accesskit` feature is only
# available with `android-game-activity`").
prowave-app = { path = "../../crates/prowave-app", default-features = false }
prowave-engine = { path = "../../crates/prowave-engine" }
prowave-project = { path = "../../crates/prowave-project" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "persistence", "android-native-activity"] }
egui = "0.37"
egui-winit = { version = "0.37", default-features = false, features = ["android-native-activity", "clipboard", "links"] }
rfd = "0.17"
log = "0.4"
serde_json = "1.0"
jni = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
android_logger = "0.15"

[package.metadata.android]
package = "com.artcraft.prowave"
apk_name = "prowave"
build_targets = ["aarch64-linux-android"]
resources = "res"
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "ProWave"
theme = "@style/Theme.Artcraft"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = ".ProWaveActivity"
config_changes = "orientation|keyboard|keyboardHidden|navigation|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode|fontScale|locale"
label = "ProWave"
launch_mode = "singleTask"
orientation = "sensor"
exported = true
intent_filter = [{ actions = ["android.intent.action.MAIN"], categories = ["android.intent.category.LAUNCHER"] }]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "prowave_android"
