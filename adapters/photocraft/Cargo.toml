[package]
name = "photocraft-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
photocraft-engine = { path = "../../crates/engine" }
photocraft-ui-egui = { path = "../../crates/ui-egui" }
photocraft-io = { path = "../../crates/io" }
photocraft-doc = { path = "../../crates/doc" }
photocraft-codecs = { path = "../../crates/codecs" }
photocraft-format = { path = "../../crates/format" }
eframe = { workspace = true, features = ["wgpu", "persistence", "android-game-activity"] }
egui = { workspace = true }
egui-winit = "0.36"
log = { workspace = true }
serde_json = { workspace = true }
jni = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false, features = ["game-activity"] }
# Rust `log` records to logcat; without this launcher/bridge errors were silent on device.
android_logger = "0.15"

[package.metadata.android]
package = "com.artcraft.photocraft"
apk_name = "photocraft"
build_targets = ["aarch64-linux-android"]
resources = "res"
java_sources = "java"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

# Let the app's own file builders read and write files on the device (see
# PhotoCraftActivity: requestStoragePermission). Legacy permissions cover
# Android 12 and older; "All files access" covers Android 11+ and the font folders the
# shell links for the app (the device's own faces and the user's own Fonts folder).
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

# The update checker asks GitHub for a newer release of the builder (see
# templates/android/UpdateCheck.java). Without this the request fails and no update is offered.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "PhotoCraft"
# GameActivity extends AppCompatActivity, which refuses to inflate under a framework-only
# theme; the builder generates res/values/themes.xml with this style (AppCompat parent).
theme = "@style/Theme.Artcraft"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = ".PhotoCraftActivity"
config_changes = "orientation|keyboard|keyboardHidden|navigation|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode|fontScale|locale"
label = "PhotoCraft"
launch_mode = "singleTask"
orientation = "sensor"
exported = true
# The MAIN/LAUNCHER filter that gives the APK a launcher icon; lib/file_associations.py may
# append VIEW/SEND filters for the app's document types by rewriting this single line.
intent_filter = [{ actions = ["android.intent.action.MAIN"], categories = ["android.intent.category.LAUNCHER"] }]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "photocraft_android"
