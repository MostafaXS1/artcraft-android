[package]
name = "egui-winit"
version = "0.37.0"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
description = "Bindings for using egui with winit"
edition = "2024"
rust-version = "1.95"
homepage = "https://github.com/emilk/egui/tree/main/crates/egui-winit"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/emilk/egui/tree/main/crates/egui-winit"
categories = ["gui", "game-development"]
keywords = ["winit", "egui", "gui", "gamedev"]

[lints.clippy]
all = "warn"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[package.metadata.cargo-shear]
ignored = ["wayland-cursor"] # TODO(emilk): remove when we update winit

[features]
default = ["links", "winit/default"]

## Enable platform accessibility API implementations through [AccessKit](https://accesskit.dev/).
accesskit = ["dep:accesskit_winit"]

# Allow crates to choose an android-activity backend via Winit
# - It's important that most applications should not have to depend on android-activity directly, and can
#   rely on Winit to pull in a suitable version (unlike most Rust crates, any version conflicts won't link)
# - It's also important that we don't impose an android-activity backend by taking this choice away from applications.
## Enable the `game-activity` backend via Winit on Android
android-game-activity = ["winit/android-game-activity"]
## Enable the `native-activity` backend via Winit on Android
android-native-activity = ["winit/android-native-activity"]

## [`bytemuck`](https://docs.rs/bytemuck) enables you to cast [`egui::epaint::Vertex`], [`egui::Vec2`] etc to `&[u8]`.
bytemuck = ["egui/bytemuck", "dep:bytemuck"]

## Enable cut/copy/paste to OS clipboard.
## If disabled a clipboard will be simulated so you can still copy/paste within the egui app.
clipboard = []

## Enable bounded PNG image copy/paste through the event-loop clipboard path.
##
## This implies `clipboard`; the codec itself additionally requires a supported Unix
## Wayland target and the `wayland` feature. `image` is built with only its PNG feature.
clipboard-image = ["clipboard"]

## Enable opening links in a browser when an egui hyperlink is clicked.
links = ["webbrowser"]

## Allow serialization of [`WindowSettings`] using [`serde`](https://docs.rs/serde).
serde = ["egui/serde", "dep:serde"]

## Enables Wayland support.
wayland = ["winit/wayland", "bytemuck"]

## Enables compiling for x11.
x11 = ["winit/x11", "winit/rwh_06", "bytemuck"]

[dependencies]
egui = { version = "0.37.0", default-features = false }

log = "0.4"
profiling = "1.0"
raw-window-handle = "0.6.2"
web-time = "1.1"
winit = { version = "0.30.13", default-features = false }

#! ### Optional dependencies

# feature accesskit
accesskit_winit = { version = "0.34.1", optional = true }

bytemuck = { version = "1.25", optional = true }

## Enable this when generating docs.
document-features = { version = "0.2", optional = true }

serde = { version = "1.0", features = ["derive"], optional = true }
webbrowser = { version = "1.2", optional = true }

# feature clipboard-image
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1.1"
